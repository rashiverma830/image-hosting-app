<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="midGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.18"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="108" height="84" rx="20"/>
    </clipPath>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(15, 26)">
    <!-- Back Card Layer -->
    <rect x="-2" y="-12" width="108" height="84" rx="20" transform="rotate(-9 54 42)" fill="url(#backGrad)"/>
    <!-- Middle Card Layer -->
    <rect x="0" y="-7" width="108" height="84" rx="20" transform="rotate(-4 54 42)" fill="url(#midGrad)"/>

    <!-- Front Main Card -->
    <g filter="url(#cardShadow)">
      <rect x="4" y="0" width="108" height="84" rx="20" fill="url(#frontGrad)"/>
      
      <!-- Inner Elements Clipped to Front Card -->
      <g transform="translate(4, 0)" clip-path="url(#cardClip)">
        <!-- Sun/Moon Circle -->
        <circle cx="34" cy="28" r="9" fill="#FFFFFF"/>
        
        <!-- Mountain Left (Small Peak) -->
        <path d="M-8 86 L32 44 L68 86 Z" fill="#FFFFFF" fill-opacity="0.95"/>
        
        <!-- Mountain Right (Large Peak overlapping) -->
        <path d="M26 86 L62 28 L114 86 Z" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- Right Typography Group -->
  <g transform="translate(156, 0)">
    <!-- Main imgly Text -->
    <text x="0" y="80" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="74" 
          font-weight="900" 
          fill="#6366f1" 
          letter-spacing="-2px">imgly</text>
    
    <!-- Subtitle IMAGE HOSTING -->
    <text x="4" y="108" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="14.5" 
          font-weight="700" 
          fill="#818cf8" 
          letter-spacing="5.5px">IMAGE HOSTING</text>
  </g>
</svg>
